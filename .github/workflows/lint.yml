name: lint

# WP-07 (PRODUCTION.md "CI, lint tier"). Standalone: this job never touches the private infra
# repository and holds no credential of any kind. See lint-steps.sh for what runs and why.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout agentcell-client (this repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # README.md: "Releases require exactly Go 1.25.5" — make lint-selftest is held to the same
      # pin the release process is, not floated to "latest 1.25.x".
      - name: Set up Go 1.25.5
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.25.5"
          check-latest: false

      - name: make lint && make lint-selftest
        run: .github/workflows/lint-steps.sh
